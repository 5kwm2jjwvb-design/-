<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-Regular.ttf);font-weight:400}
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111}
body{position:relative;font-family:"ZOM",serif;font-weight:400;font-size:50px;line-height:1.7;letter-spacing:.05em;font-feature-settings:"palt" 0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.ln{white-space:nowrap}
.mk{background:linear-gradient(transparent 58%, rgba(170,210,140,.45) 58%)}
.em{font-weight:600}
.hero{font-weight:600}
.next{position:absolute;right:72px;bottom:350px;font-size:26px;letter-spacing:.08em;opacity:.8;line-height:1}
.dark{color:#fff}
.dark .ln{text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.45)}
.dark .em,.dark .hero{color:#C2E3A8}

.glow{position:absolute;left:50%;top:640px;width:1150px;height:860px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,.35) 55%, rgba(0,0,0,0))}
.txt{position:absolute;left:72px;right:72px;top:340px;text-align:center}
.spot{position:absolute;left:485px;top:1295px;width:110px;height:110px;border-radius:50%;
  border:4.5px dashed #fff;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.spotlabel{position:absolute;left:617px;top:1332px;font-size:30px;line-height:1.2;color:#fff;letter-spacing:.06em;
  text-shadow:0 0 2px #000,0 1px 3px rgba(0,0,0,.8)}
</style></head><body><div class="bg" style="background-image:url(../bg/05.jpg)"></div><div class="glow"></div>
<div class="txt dark"><div class="ln">遠くの人とも話したかったから。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln">言葉にするだけで、</div>
<div class="ln"><span class="mk">夜が少し軽くなる</span>かもしれません。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln">ひとことだけ、</div>
<div class="ln">下から送ってみてください。</div></div>
<div class="spot"></div><div class="spotlabel">質問ボックス</div></body></html>
