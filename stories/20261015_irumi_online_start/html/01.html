<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-Regular.ttf);font-weight:400}
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111}
body{position:relative;font-family:"ZOM",serif;font-weight:400;font-size:50px;line-height:1.7;letter-spacing:.05em;font-feature-settings:"palt" 0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.ln{white-space:nowrap}
.mk{background:linear-gradient(transparent 58%, rgba(170,210,140,.45) 58%)}
.em{font-weight:600}
.hero{font-weight:600}
.next{position:absolute;right:72px;bottom:350px;font-size:26px;letter-spacing:.08em;opacity:.8;line-height:1}
.dark{color:#fff}
.dark .ln{text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.45)}
.dark .em,.dark .hero{color:#C2E3A8}

.glow{position:absolute;left:50%;top:50%;width:1150px;height:820px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(10,12,28,.62), rgba(10,12,28,.40) 55%, rgba(10,12,28,0))}
.txt{position:absolute;left:72px;right:72px;top:50%;transform:translateY(-50%);text-align:center}
.ln,.head,.next,.spotlabel{color:transparent!important;text-shadow:none!important}</style></head><body><div class="bg" style="background-image:url(../bg/01.jpg)"></div><div class="glow"></div>
<div class="txt dark"><div class="ln">好きな人のことなのに、</div>
<div class="ln"><span class="mk">誰にも話せない</span>。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln">そんな恋をしている人に、</div>
<div class="ln">今日は少し話しかけてみます。</div></div><div class="next" style="color:#fff;text-shadow:0 0 2px rgba(0,0,0,.9),0 1px 8px rgba(0,0,0,.7)">次へ →</div></body></html>
