<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-Regular.ttf);font-weight:400}
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111}
body{position:relative;font-family:"ZOM",serif;font-weight:400;font-size:46px;line-height:1.7;letter-spacing:.05em;font-feature-settings:"palt" 0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.ln{white-space:nowrap}
.mk{background:linear-gradient(transparent 58%, rgba(170,210,140,.45) 58%)}
.em{font-weight:600}
.hero{font-weight:600}
.next{position:absolute;right:72px;bottom:350px;font-size:26px;letter-spacing:.08em;opacity:.8;line-height:1}
.dark{color:#fff}
.dark .ln{text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.45)}
.dark .em,.dark .hero{color:#C2E3A8}

.shade{position:absolute;left:0;right:0;top:0;height:1150px;background:linear-gradient(rgba(0,0,0,.70),rgba(0,0,0,.45) 60%,rgba(0,0,0,0))}
.head{position:absolute;left:96px;top:300px;font-size:104px;line-height:1.35;font-weight:600;color:#C2E3A8;letter-spacing:.06em;text-shadow:0 2px 6px rgba(0,0,0,.5)}
.rule{position:absolute;left:100px;top:600px;width:160px;height:2px;background:#C2E3A8;opacity:.85}
.txt{position:absolute;left:100px;right:72px;top:650px;text-align:left}
.ln,.head,.next,.spotlabel{color:transparent!important;text-shadow:none!important}</style></head><body><div class="bg" style="background-image:url(../bg/03.jpg)"></div><div class="shade"></div>
<div class="head"><div class="ln">私も、複雑な恋を</div><div class="ln">してきました。</div></div><div class="rule"></div>
<div class="txt dark"><div class="ln">だから、頭ごなしに</div>
<div class="ln">「やめなよ」とは言わないんです。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln">でも、それだけじゃなくて。</div></div><div class="next" style="color:#fff;text-shadow:0 0 2px rgba(0,0,0,.9),0 1px 8px rgba(0,0,0,.7)">次へ →</div></body></html>
