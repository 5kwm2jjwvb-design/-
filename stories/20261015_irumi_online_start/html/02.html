<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-Regular.ttf);font-weight:400}
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#111}
body{position:relative;font-family:"ZOM",serif;font-weight:400;font-size:48px;line-height:1.7;letter-spacing:.05em;font-feature-settings:"palt" 0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.ln{white-space:nowrap}
.mk{background:linear-gradient(transparent 58%, rgba(170,210,140,.45) 58%)}
.em{font-weight:600}
.hero{font-weight:600}
.next{position:absolute;right:72px;bottom:350px;font-size:26px;letter-spacing:.08em;opacity:.8;line-height:1}
.dark{color:#fff}
.dark .ln{text-shadow:0 1px 3px rgba(0,0,0,.55),0 0 18px rgba(0,0,0,.45)}
.dark .em,.dark .hero{color:#C2E3A8}

.img{position:absolute;left:0;top:0;width:1080px;height:860px;background:url(../bg/02.jpg) center 62%/cover}
.panel{position:absolute;left:-60px;right:-60px;top:800px;bottom:0;background:#E9EFE5;border-radius:50% 50% 0 0/70px 70px 0 0}
.txt{position:absolute;left:120px;right:72px;top:905px;color:#253026;text-align:left}
.em,.hero{color:#7A5A12}
.ln,.head,.next,.spotlabel{color:transparent!important;text-shadow:none!important}</style></head><body><div class="img"></div><div class="panel"></div>
<div class="txt"><div class="ln">友だちに話したら</div>
<div class="ln">「やめなよ」で終わりそう。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln">家族になんて、</div>
<div class="ln">もっと言えないですよね。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln"><span class="mk">そうやって夜ひとりで</span></div>
<div class="ln"><span class="mk">抱えていませんか？</span></div></div><div class="next" style="color:#253026">次へ →</div></body></html>
