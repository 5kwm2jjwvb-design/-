<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"NSJ";src:url(fonts/NotoSansJP.ttf);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a110c}
body{position:relative;font-family:"NSJ",sans-serif;font-weight:400;font-size:40px;color:#fff;letter-spacing:.04em}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.txt{position:absolute;left:92px;right:60px;top:255px;
  display:flex;flex-direction:column;align-items:flex-start;gap:0.55em}
.blk{line-height:1.78}
.ln{display:block;white-space:nowrap}
.ln span.t,.ln .hero{background:rgba(24,16,12,.76);padding:.1em .34em .14em;border-radius:.28em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.em{color:#FFC08A;font-weight:500}
.hero{color:#FFC08A;font-weight:500;font-size:1.3em;letter-spacing:.04em;line-height:1.5}
.next{position:absolute;right:64px;bottom:352px;font-size:26px;line-height:1;letter-spacing:.06em;
  background:rgba(24,16,12,.76);padding:.32em .6em;border-radius:.4em;opacity:.92}
.spot{position:absolute;left:930px;top:1785px;width:110px;height:110px;border-radius:50%;
  border:4.5px dashed #fff;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.spotlabel{position:absolute;right:168px;top:1822px;font-size:30px;line-height:1.2;letter-spacing:.06em;
  text-shadow:0 0 2px #000,0 1px 3px rgba(0,0,0,.8)}

</style></head><body>
<div class="bg" style="background-image:url(../bg/05.jpg)"></div>
<div class="txt"><div class="blk" style="transform:translateX(-14px) rotate(0deg);transform-origin:left center"><span class="ln"><span class="t">恋って、内面だけじゃなく、</span></span><span class="ln"><span class="t">外見まで美しくしてくれるんだって。</span></span></div>
<div class="blk" style="transform:translateX(0px) rotate(0deg);transform-origin:left center"><span class="ln"><span class="t">だから、恋で悩んでいるあなたは、</span></span><span class="ln"><span class="t">実はとても素敵なんです。</span></span></div>
<div class="blk" style="transform:translateX(26px) rotate(0deg);transform-origin:left center"><span class="ln"><span class="t">人に言えない恋を抱えていても、</span></span><span class="ln"><span class="hero">あなたは、ちゃんと美しい。</span></span></div>
<div class="blk" style="transform:translateX(-8px) rotate(0deg);transform-origin:left center"><span class="ln"><span class="t">少しでもそう思えた人は、</span></span><span class="ln"><span class="t">右下のハートで教えてくださいね。</span></span></div></div>
