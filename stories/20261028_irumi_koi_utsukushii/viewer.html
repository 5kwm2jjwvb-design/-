<title>恋は、あなたを美しくする</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* 焦げ茶の夕暮れに、テラコッタの灯り。ストーリーズ5枚を縦に並べ、長押しで保存できる閲覧ページ */
:root {
  --bg: #1a120d;
  --surface: #261a13;
  --line: #3a2a20;
  --fg: #f6ece4;
  --muted: #c2ad9f;
  --accent: #ffc08a;
  --display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 36px; }
header { display: grid; gap: 10px; }
.kicker { font-size: 12px; letter-spacing: .14em; color: var(--accent); }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.35; letter-spacing: .04em; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }
.how { margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; }
.how b { color: var(--accent); font-weight: 500; }
.slide { margin: 0; display: grid; gap: 12px; }
.slide figcaption { display: flex; align-items: baseline; gap: 10px; }
.no { font-family: var(--display); font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.role { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
.slide img { display: block; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; height: auto; border-radius: 14px; background: var(--surface); }
.note { margin: 0; padding: 12px 14px; border-left: 2px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; font-size: 14px; color: var(--fg); }
.note span { color: var(--accent); }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
</style>

<div class="wrap">
  <header>
    <div class="kicker">INSTAGRAM STORIES ・ 5枚</div>
    <h1>恋は、あなたを美しくする</h1>
    <p class="lead">対面鑑定で印象に残っている方のお話です。上から順に投稿してください。</p>
    <p class="how"><b>保存のしかた：</b>画像を長押しして「"写真"に保存」を選ぶと、カメラロールに入ります。投稿にはそのまま使えます（1080×1920）。</p>
  </header>

  <figure class="slide">
    <figcaption><span class="no">1</span><span class="role">あいさつ・ある方の話</span></figcaption>
    <img src="slides/01.png" width="1080" height="1920" alt="いつもご覧いただき、ありがとうございます。今日は、対面鑑定でとても印象に残っているある方のお話をさせてください。">
  </figure>
  <figure class="slide">
    <figcaption><span class="no">2</span><span class="role">初恋の悩み</span></figcaption>
    <img src="slides/02.png" width="1080" height="1920" alt="その方は、初恋の悩みで鑑定に来てくれました。言い方は良くないかもしれませんが、身なりをあまり気にされない方、というのが正直な第一印象でした。">
  </figure>
  <figure class="slide">
    <figcaption><span class="no">3</span><span class="role">変化の始まり</span></figcaption>
    <img src="slides/03.png" width="1080" height="1920" alt="それでも、何度も私のところに足を運んでくれて。想う人との距離が近づくにつれて、その方は少しずつ変わっていったんです。">
  </figure>
  <figure class="slide">
    <figcaption><span class="no">4</span><span class="role">きれいになっていく姿</span></figcaption>
    <img src="slides/04.png" width="1080" height="1920" alt="外見にも気を使われるようになって、ダイエットもされて。会うたびに、どんどんきれいになっていく姿を見せてもらいました。そのとき、改めて思ったんです。">
  </figure>
  <figure class="slide">
    <figcaption><span class="no">5</span><span class="role">着地（投稿用）</span></figcaption>
    <img src="slides/05.png" width="1080" height="1920" alt="恋って、内面だけじゃなく、外見まで美しくしてくれるんだって。だから、恋で悩んでいるあなたは、実はとても素敵なんです。人に言えない恋を抱えていても、あなたは、ちゃんと美しい。少しでもそう思えた人は、右下のハートで教えてくださいね。">
    <p class="note"><span>リアクション：</span>いいね（ハート）。画面右下のハートなので、スタンプは置きません。</p>
  </figure>

  <figure class="slide">
    <figcaption><span class="no">5</span><span class="role">ハートの位置確認用（投稿しない）</span></figcaption>
    <img src="guide/05_guide.png" width="1080" height="1920" alt="5枚目のガイド。右下の点線の丸が、いいね（ハート）の位置。">
  </figure>

  <footer>背景写真はすべて Unsplash のフリー素材（商用利用可・クレジット表記不要）です。</footer>
</div>
