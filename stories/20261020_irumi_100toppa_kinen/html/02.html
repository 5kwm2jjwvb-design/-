<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-Regular.ttf);font-weight:400}
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0d1020}
body{position:relative;font-family:"ZOM",serif;font-weight:400;color:#fff;letter-spacing:.05em}
.bg{position:absolute;inset:0;background:url(../bg/02.jpg) center/cover}
.shade{position:absolute;left:0;right:0;top:0;height:1600px;
  background:linear-gradient(rgba(0,0,0,.70),rgba(0,0,0,.70) 1220px,rgba(0,0,0,.35) 1390px,rgba(0,0,0,0))}
.blk{position:absolute;top:290px;left:96px;right:72px;display:flex;flex-direction:column;align-items:center}
.head{font-size:100px;line-height:1.32;font-weight:600;color:#FFD65A;letter-spacing:.06em;text-align:center;
  text-shadow:0 2px 6px rgba(0,0,0,.55)}
.rule{width:150px;height:2px;background:#FFD65A;opacity:.9;margin:38px 0 44px}
.txt{font-size:44px;line-height:1.7;text-align:left}
.ln{white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6),0 0 16px rgba(0,0,0,.45)}
.mk{background:linear-gradient(transparent 60%, rgba(255,214,90,.60) 60%)}
.em,.hero{color:#FFD65A;font-weight:600}
.next{position:absolute;right:72px;bottom:352px;font-size:26px;line-height:1;letter-spacing:.08em;opacity:.88;
  padding:10px 18px;border-radius:999px;background:rgba(10,14,30,.45);
  text-shadow:0 0 2px rgba(0,0,0,.9),0 1px 8px rgba(0,0,0,.7)}
.spot{position:absolute;left:485px;top:1315px;width:110px;height:110px;border-radius:50%;
  border:4.5px dashed #fff;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.spotlabel{position:absolute;left:615px;top:1353px;font-size:30px;line-height:1.15;letter-spacing:.06em;
  text-shadow:0 0 2px #000,0 1px 3px rgba(0,0,0,.8)}
</style></head><body><div class="bg"></div><div class="shade"></div>
<div class="blk"><div class="head"><div class="ln">せっかくなので、</div><div class="ln">始まりの話を。</div></div>
<div class="rule"></div><div class="txt"><div class="ln">昔の私は、占いに興味のない</div>
<div class="ln"><span class="mk">ただの男</span>でした。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln">元カノに連れられて行った占い師さんに、</div>
<div class="ln">「あなた、占い向いてるよ」と</div>
<div class="ln">言われたのが、始まりなんです。</div></div></div>
<div class="next">次へ →</div>
</body></html>
