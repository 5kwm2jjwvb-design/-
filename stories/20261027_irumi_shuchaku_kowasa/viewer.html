<title>執着の下の怖さ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* 焦げ茶の夕暮れに、テラコッタの灯り。ストーリーズ5枚を縦に並べ、長押しで保存できる閲覧ページ */
:root {
  --bg: #1a120d;
  --surface: #261a13;
  --line: #3a2a20;
  --fg: #f6ece4;
  --muted: #c2ad9f;
  --accent: #ffc08a;
  --display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 36px; }
header { display: grid; gap: 10px; }
.kicker { font-size: 12px; letter-spacing: .14em; color: var(--accent); }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.35; letter-spacing: .04em; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }
.how { margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; }
.how b { color: var(--accent); font-weight: 500; }
.slide { margin: 0; display: grid; gap: 12px; }
.slide figcaption { display: flex; align-items: baseline; gap: 10px; }
.no { font-family: var(--display); font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.role { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
.slide img { display: block; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; height: auto; border-radius: 14px; background: var(--surface); }
.note { margin: 0; padding: 12px 14px; border-left: 2px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; font-size: 14px; color: var(--fg); }
.note span { color: var(--accent); }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
</style>

<div class="wrap">
  <header>
    <div class="kicker">INSTAGRAM STORIES ・ 5枚</div>
    <h1>執着の下にあった「怖さ」</h1>
    <p class="lead">信用の教育のストーリーズです。上から順に投稿してください。</p>
    <p class="how"><b>保存のしかた：</b>画像を長押しして「"写真"に保存」を選ぶと、カメラロールに入ります。投稿にはそのまま使えます（1080×1920）。</p>
  </header>

  <figure class="slide">
    <figcaption><span class="no">1</span><span class="role">導入・過去の自分</span></figcaption>
    <img src="slides/01.png" width="1080" height="1920" alt="ひとつの恋に、3年ほど執着していた時期があります。今だから話せますが、自分でも長くて、しんどい3年でした。">
  </figure>
  <figure class="slide">
    <figcaption><span class="no">2</span><span class="role">気づき1</span></figcaption>
    <img src="slides/02.png" width="1080" height="1920" alt="その3年、私は相手のことをずっと考えているつもりだったんです。でも振り返ると、頭にあったのは「離れていかないかな」という不安ばかり。好きな気持ちは、どこにあったんだろうって。">
  </figure>
  <figure class="slide">
    <figcaption><span class="no">3</span><span class="role">気づき2</span></figcaption>
    <img src="slides/03.png" width="1080" height="1920" alt="好きな気持ちは、3年のあいだに少しずつ「怖さ」に入れ替わっていた気がします。手放したら何も残らない気がする怖さです。そう気づいたら、見え方がひとつ変わりました。">
  </figure>
  <figure class="slide">
    <figcaption><span class="no">4</span><span class="role">一本の線につながる</span></figcaption>
    <img src="slides/04.png" width="1080" height="1920" alt="3年かけて分かったのは、執着は好きが大きいからじゃなく、怖さが大きいと起きるということ。占い師のあなたも、人の恋なら落ち着いて見られるのに、自分の恋だと苦しくなりませんか？">
  </figure>
  <figure class="slide">
    <figcaption><span class="no">5</span><span class="role">着地（投稿用）</span></figcaption>
    <img src="slides/05.png" width="1080" height="1920" alt="だから、好きな気持ちまで責めなくていいんです。見てあげたいのは、その下にある怖さのほう。あの3年の私に言ってあげたかった。あなたの執着は、「好き」と「怖さ」どっちに近い？">
    <p class="note"><span>アンケート：</span>「あなたの執着、近いのはどっち？」／好きだから・手放すのが怖いから。スタンプは投稿のときに置きます。</p>
  </figure>

  <figure class="slide">
    <figcaption><span class="no">5</span><span class="role">アンケートの位置確認用（投稿しない）</span></figcaption>
    <img src="guide/05_guide.png" width="1080" height="1920" alt="5枚目のガイド。点線の丸が、アンケートを置く中心の位置。">
  </figure>

  <footer>背景写真はすべて Unsplash のフリー素材（商用利用可・クレジット表記不要）です。</footer>
</div>
