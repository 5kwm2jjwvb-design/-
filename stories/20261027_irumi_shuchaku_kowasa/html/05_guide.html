<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"NSJ";src:url(fonts/NotoSansJP.ttf);font-weight:100 900}
@font-face{font-family:"KUR";src:url(fonts/ZenKurenaido-Regular.ttf)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a110c}
body{position:relative;font-family:"NSJ",sans-serif;font-weight:400;font-size:40px;color:#fff;letter-spacing:.04em}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.txt{position:absolute;left:92px;right:60px;top:255px;
  display:flex;flex-direction:column;align-items:flex-start;gap:0.55em}
.blk{line-height:1.78}
.ln{display:block;white-space:nowrap}
.ln span.t,.ln .hero{background:rgba(24,16,12,.76);padding:.1em .34em .14em;border-radius:.28em;
  -webkit-box-decoration-break:clone;box-decoration-break:clone}
.em{color:#FFC08A;font-weight:500}
.hero{font-family:"KUR",sans-serif;color:#FFC08A;font-size:1.35em;letter-spacing:.06em;line-height:1.5}
.next{position:absolute;right:64px;bottom:352px;font-size:26px;line-height:1;letter-spacing:.06em;
  background:rgba(24,16,12,.76);padding:.32em .6em;border-radius:.4em;opacity:.92}
.spot{position:absolute;left:485px;top:1285px;width:110px;height:110px;border-radius:50%;
  border:4.5px dashed #fff;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.spotlabel{position:absolute;right:613px;top:1322px;font-size:30px;line-height:1.2;letter-spacing:.06em;
  text-shadow:0 0 2px #000,0 1px 3px rgba(0,0,0,.8)}

</style></head><body>
<div class="bg" style="background-image:url(../bg/05.jpg)"></div>
<div class="txt"><div class="blk" style="transform:translateX(-14px) rotate(0.7deg);transform-origin:left center"><span class="ln"><span class="t">そんなとき、思い立ったように</span></span><span class="ln"><span class="t">ふっと占いを受けました。</span></span></div>
<div class="blk" style="transform:translateX(0px) rotate(-1.2deg);transform-origin:left center"><span class="ln"><span class="t">否定されずに受け止めてもらえて、</span></span><span class="ln"><span class="t">ずっと張りつめていたものが、</span></span><span class="ln"><span class="t">すっとほどけた。</span></span></div>
<div class="blk" style="transform:translateX(26px) rotate(0.9deg);transform-origin:left center"><span class="ln"><span class="t">誰かに打ち明けられる安堵で、</span></span><span class="ln"><span class="t">ようやく心が晴れたのを覚えています。</span></span></div>
<div class="blk" style="transform:translateX(-8px) rotate(-0.6deg);transform-origin:left center"><span class="ln"><span class="t">あの経験があったから、</span></span><span class="ln"><span class="t"><span class="em">誰にも相談できない恋の苦しさ</span>が、</span></span><span class="ln"><span class="t">分かります。</span></span></div></div>

<div class="spot"></div><div class="spotlabel">質問ボックス</div>
</body></html>
