<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-Regular.ttf);font-weight:400}
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#1a110c}
body{position:relative;font-family:"ZOM",serif;font-weight:400;font-size:44px;line-height:1.7;letter-spacing:.05em;color:#fff}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.glow{position:absolute;left:540px;top:575px;width:1250px;height:820px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(22,12,8,0.66), rgba(22,12,8,0.46) 60%, rgba(22,12,8,0))}
.txt{position:absolute;left:72px;right:72px;text-align:center;
  top:300px;}
.ln{white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6),0 0 16px rgba(0,0,0,.45)}
.ln.big{line-height:1.45}
.em{color:#FFC08A;font-weight:600}
.hero{color:#FFC08A;font-weight:600;font-size:1.4em;letter-spacing:.04em}
.mk{background:linear-gradient(transparent 76%, rgba(255,200,80,.55) 76%, rgba(255,200,80,.55) 96%, transparent 96%)}
.next{position:absolute;right:72px;bottom:352px;padding:16px 10px 16px 24px;background:radial-gradient(closest-side, rgba(22,12,8,.88), rgba(22,12,8,.6) 60%, rgba(22,12,8,0));font-size:26px;line-height:1;letter-spacing:.08em;opacity:.9;
  text-shadow:0 0 2px rgba(0,0,0,.9),0 1px 8px rgba(0,0,0,.7)}
.spot{position:absolute;left:485px;top:1285px;width:110px;height:110px;border-radius:50%;
  border:4.5px dashed #fff;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.spotlabel{position:absolute;right:613px;top:1322px;font-size:30px;line-height:1.2;letter-spacing:.06em;
  text-shadow:0 0 2px #000,0 1px 3px rgba(0,0,0,.8)}

</style></head><body>
<div class="bg" style="background-image:url(../bg/04.jpg)"></div><div class="glow"></div>
<div class="txt"><div class="ln">友達にも、職場にも、家族にも言えない。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln">楽しかった日ほど、</div>
<div class="ln">帰り道でひとりになると苦しくなる。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln big"><span class="hero">「どうしてこの人なんだろう」</span></div>
<div class="ln">そんな夜を、何度も過ごしました。</div></div>
<div class="next">次へ →</div>

</body></html>
