<title>鍵と今日の一歩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500&display=swap">
<style>
/* 紺の夜に、黄色い灯りの付箋。ストーリーズ5枚を縦に並べ、長押しで保存できる閲覧ページ */
:root {
  --bg: #0d1322;
  --surface: #161e33;
  --line: #27304a;
  --fg: #eef0f6;
  --muted: #a5adc2;
  --accent: #ffd65a;
  --display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
  color-scheme: dark;
}
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--body);
  font-size: 15px;
  line-height: 1.75;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 460px; margin: 0 auto; padding-block: 28px 56px; display: grid; gap: 36px; }
header { display: grid; gap: 10px; }
.kicker { font-size: 12px; letter-spacing: .14em; color: var(--accent); }
h1 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 30px; line-height: 1.35; letter-spacing: .04em; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }
.how { margin: 0; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); font-size: 14px; }
.how b { color: var(--accent); font-weight: 500; }
.slide { margin: 0; display: grid; gap: 12px; }
.slide figcaption { display: flex; align-items: baseline; gap: 10px; }
.no { font-family: var(--display); font-size: 22px; color: var(--accent); font-variant-numeric: tabular-nums; }
.role { font-size: 13px; color: var(--muted); letter-spacing: .06em; }
.slide img { display: block; width: 100%; max-width: 100%; aspect-ratio: 9 / 16; height: auto; border-radius: 14px; background: var(--surface); }
.note { margin: 0; padding: 12px 14px; border-left: 2px solid var(--accent); background: var(--surface); border-radius: 0 10px 10px 0; font-size: 14px; color: var(--fg); }
.note span { color: var(--accent); }
footer { color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); padding-top: 16px; }
</style>

<div class="wrap">
  <header>
    <div class="kicker">INSTAGRAM STORIES ・ 5枚</div>
    <h1>心にかけた鍵と、今日の一歩</h1>
    <p class="lead">行動の教育のストーリーズです。上から順に投稿してください。</p>
    <p class="how"><b>保存のしかた：</b>画像を長押しして「"写真"に保存」を選ぶと、カメラロールに入ります。投稿にはそのまま使えます（1080×1920）。</p>
  </header>

  <figure class="slide">
    <figcaption><span class="no">1</span><span class="role">導入・過去の自分</span></figcaption>
    <img src="slides/01.png" width="1080" height="1920" alt="20代のころまで、私は誰のことも信じられずにいました。心に鍵をかけたみたいに、人と深く関わるのを避けていたんです。">
  </figure>

  <figure class="slide">
    <figcaption><span class="no">2</span><span class="role">深掘り・どん底</span></figcaption>
    <img src="slides/02.png" width="1080" height="1920" alt="きっかけは、信頼していた人の裏切りでした。信じていた分だけ、何を信じたらいいのか分からなくなって。心に鍵をかけていた私を、占いに誘ってくれたのが、親しくなったひとりの女性でした。">
  </figure>

  <figure class="slide">
    <figcaption><span class="no">3</span><span class="role">転機</span></figcaption>
    <img src="slides/03.png" width="1080" height="1920" alt="誘われて行った占いで、占い師さんがこう言ってくれました。「あなた本当は、人と関わること向いてるよ」ヒーリングも受けて、その言葉だけは不思議と、鍵のすき間からすっと入ってきたんです。">
  </figure>

  <figure class="slide">
    <figcaption><span class="no">4</span><span class="role">見方の転換</span></figcaption>
    <img src="slides/04.png" width="1080" height="1920" alt="たくさんの生きざまを見てきた人の言葉だったから。あの一言が今も私を支えています。今度は、占い師のあなたの言葉が誰かの鍵になる番です。なのに、告知を書きかけて閉じた夜、ありませんか？">
  </figure>

  <figure class="slide">
    <figcaption><span class="no">5</span><span class="role">着地・行動（投稿用）</span></figcaption>
    <img src="slides/05.png" width="1080" height="1920" alt="私も、鍵をかけたまま何年も足踏みしていたから分かります。でも、迷っている間も、あなたの言葉を待つ人がいるんです。今日ひとつ動くと決めた人は、右下のハートで教えてください。">
    <p class="note"><span>リアクション：</span>いいね（ハート）。画面右下のハートを押してもらう形なので、スタンプは置きません。</p>
  </figure>

  <figure class="slide">
    <figcaption><span class="no">5</span><span class="role">位置の確認用（投稿しない）</span></figcaption>
    <img src="guide/05_guide.png" width="1080" height="1920" alt="5枚目のガイド。右下の点線の丸が、いいね（ハート）の位置。">
  </figure>

  <footer>背景写真はすべて Unsplash のフリー素材（商用利用可・クレジット表記不要）です。</footer>
</div>
