<!doctype html><html lang="ja"><head><meta charset="utf-8"><style>
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-Regular.ttf);font-weight:400}
@font-face{font-family:"ZOM";src:url(fonts/ZenOldMincho-SemiBold.ttf);font-weight:600}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1020}
body{position:relative;font-family:"ZOM",serif;font-weight:400;font-size:44px;line-height:1.7;letter-spacing:.05em;color:#fff}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.glow{position:absolute;left:540px;top:1240px;width:1150px;height:820px;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side, rgba(6,10,24,0.62), rgba(6,10,24,0.42) 60%, rgba(6,10,24,0))}
.txt{position:absolute;left:72px;right:72px;text-align:center;
  bottom:385px;}
.ln{white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.6),0 0 16px rgba(0,0,0,.45)}
.ln.big{line-height:1.45}
.em{color:#FFD65A;font-weight:600}
.hero{color:#FFD65A;font-weight:600;font-size:1.5em;letter-spacing:.04em}
.mk{background:linear-gradient(transparent 76%, rgba(255,214,90,.60) 76%, rgba(255,214,90,.60) 96%, transparent 96%)}
.next{position:absolute;right:72px;bottom:352px;font-size:26px;line-height:1;letter-spacing:.08em;opacity:.82;
  text-shadow:0 0 2px rgba(0,0,0,.9),0 1px 8px rgba(0,0,0,.7)}
.spot{position:absolute;left:930px;top:1785px;width:110px;height:110px;border-radius:50%;
  border:4.5px dashed #fff;filter:drop-shadow(0 0 1.5px rgba(0,0,0,.9)) drop-shadow(0 1px 2px rgba(0,0,0,.6))}
.spotlabel{position:absolute;right:168px;top:1822px;font-size:30px;line-height:1.2;letter-spacing:.06em;
  text-shadow:0 0 2px #000,0 1px 3px rgba(0,0,0,.8)}

</style></head><body>
<div class="bg" style="background-image:url(../bg/05.jpg)"></div><div class="glow"></div>
<div class="txt"><div class="ln">私も、鍵をかけたまま</div>
<div class="ln">何年も足踏みしていたから分かります。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln">でも、迷っている間も、</div>
<div class="ln"><span class="em">あなたの言葉を待つ人</span>がいるんです。</div>
<div class="ln blank">&nbsp;</div>
<div class="ln"><span class="mk">今日ひとつ動く</span>と決めた人は、</div>
<div class="ln">右下のハートで教えてください。</div></div>


</body></html>
